<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1280" height="720" viewBox="0 0 1280 720">
<title>Settings · Controls — Echoes of the Rift wireframe</title>
<desc>Editable low-fidelity screen layout. All boxes, labels and controls are separate vector elements.</desc>
<rect width="1280" height="720" fill="#15141b"/>
<text x="32" y="38" class="heading">Settings · Controls</text>
<text x="1245" y="36" text-anchor="end" class="tag">EXISTING FLOW</text>
<line x1="32" y1="54" x2="1248" y2="54" stroke="#777386" stroke-width="1"/>
<rect x="220" y="65" width="840" height="590" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="640.0" y="365.0" text-anchor="middle" class="paneltitle">SETTINGS</text><rect x="250" y="125" width="190" height="480" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="345.0" y="370.0" text-anchor="middle" class="paneltitle">CONTROLS · ACCOUNTS · AUDIO · DISPLAY</text><text x="485" y="165" text-anchor="start" class="body">CONTROLS</text><rect x="485" y="205" width="500" height="95" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="735.0" y="257.5" text-anchor="middle" class="paneltitle">Move · WASD / left stick · Change</text><rect x="485" y="320" width="500" height="95" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="735.0" y="372.5" text-anchor="middle" class="paneltitle">Attack · mouse / right stick · Change</text><rect x="485" y="435" width="500" height="95" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="735.0" y="487.5" text-anchor="middle" class="paneltitle">Skills · Q / E / R · Change</text><rect x="815" y="570" width="170" height="50" rx="12" fill="#5cd3d0" fill-opacity=".94" stroke="#5cd3d0" stroke-width="2"/><text x="900.0" y="600.0" text-anchor="middle" class="button">Close</text>
<line x1="32" y1="676" x2="1248" y2="676" stroke="#777386" stroke-width="1"/>
<text x="34" y="704" class="small">DESIGN QUESTION</text><text x="190" y="704" class="body">Which controls should be customizable on PC and phone?</text>
<style>
  text { font-family: Arial, sans-serif; fill: #f2eff8; }
