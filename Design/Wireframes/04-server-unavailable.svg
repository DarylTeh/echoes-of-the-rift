<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1280" height="720" viewBox="0 0 1280 720">
<title>Server unavailable — Echoes of the Rift wireframe</title>
<desc>Editable low-fidelity screen layout. All boxes, labels and controls are separate vector elements.</desc>
<rect width="1280" height="720" fill="#15141b"/>
<text x="32" y="38" class="heading">Server unavailable</text>
<text x="1245" y="36" text-anchor="end" class="tag">EXISTING FLOW</text>
<line x1="32" y1="54" x2="1248" y2="54" stroke="#777386" stroke-width="1"/>
<rect x="100" y="185" width="450" height="380" rx="12" fill="#302e3a" fill-opacity=".94" stroke="#777386" stroke-width="2"/><path d="M112 173 L538 553 M538 173 L112 553" stroke="#777386" stroke-width="1"/><text x="325.0" y="380.0" text-anchor="middle" class="small">TITLE SCREEN / DISABLED BACKDROP</text><rect x="585" y="170" width="570" height="380" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="870.0" y="365.0" text-anchor="middle" class="paneltitle">CONNECTION REQUIRED</text><text x="650" y="280" text-anchor="start" class="body">Can&#x27;t connect right now</text><text x="650" y="365" text-anchor="start" class="body">Your account is safe. Check your connection and retry.</text><rect x="680" y="408" width="360" height="62" rx="12" fill="#5cd3d0" fill-opacity=".94" stroke="#5cd3d0" stroke-width="2"/><text x="860.0" y="444.0" text-anchor="middle" class="button">Retry connection</text><rect x="680" y="488" width="360" height="52" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="860.0" y="519.0" text-anchor="middle" class="button">Quit</text>
<line x1="32" y1="676" x2="1248" y2="676" stroke="#777386" stroke-width="1"/>
<text x="34" y="704" class="small">DESIGN QUESTION</text><text x="190" y="704" class="body">Should Quit remain here, or should Retry be the only action?</text>
<style>
  text { font-family: Arial, sans-serif; fill: #f2eff8; }
  .heading { font-size: 25px; font-weight: 700; } .tag { font-size: 12px; fill: #5cd3d0; font-weight: 700; letter-spacing: 1px; }
  .paneltitle { font-size: 15px; font-weight: 600; fill: #aaa6b8; letter-spacing: .6px; }
  .body { font-size: 17px; fill: #f2eff8; } .small { font-size: 12px; fill: #aaa6b8; }
  .button { font-size: 17px; font-weight: 700; fill: #15141b; }
</style>
</svg>