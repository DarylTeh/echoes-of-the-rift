<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1280" height="720" viewBox="0 0 1280 720">
<title>Connection lost — Echoes of the Rift wireframe</title>
<desc>Editable low-fidelity screen layout. All boxes, labels and controls are separate vector elements.</desc>
<rect width="1280" height="720" fill="#15141b"/>
<text x="32" y="38" class="heading">Connection lost</text>
<text x="1245" y="36" text-anchor="end" class="tag">EXISTING FLOW · REDESIGN PROPOSAL</text>
<line x1="32" y1="54" x2="1248" y2="54" stroke="#777386" stroke-width="1"/>
<rect x="305" y="135" width="670" height="450" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="640.0" y="365.0" text-anchor="middle" class="paneltitle">CONNECTION</text><text x="380" y="240" text-anchor="start" class="body">Connection interrupted</text><text x="385" y="325" text-anchor="start" class="body">Reconnecting… Your account and saved progress are safe.</text><rect x="410" y="355" width="460" height="65" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="640.0" y="392.5" text-anchor="middle" class="paneltitle">Connection status · attempt / elapsed</text><rect x="470" y="466" width="340" height="64" rx="12" fill="#5cd3d0" fill-opacity=".94" stroke="#5cd3d0" stroke-width="2"/><text x="640.0" y="503.0" text-anchor="middle" class="button">Reconnect</text>
<line x1="32" y1="676" x2="1248" y2="676" stroke="#777386" stroke-width="1"/>
<text x="34" y="704" class="small">DESIGN QUESTION</text><text x="190" y="704" class="body">Should reconnect happen automatically with a visible countdown?</text>
<style>
  text { font-family: Arial, sans-serif; fill: #f2eff8; }
  .heading { font-size: 25px; font-weight: 700; } .tag { font-size: 12px; fill: #5cd3d0; font-weight: 700; letter-spacing: 1px; }
  .paneltitle { font-size: 15px; font-weight: 600; fill: #aaa6b8; letter-spacing: .6px; }
  .body { font-size: 17px; fill: #f2eff8; } .small { font-size: 12px; fill: #aaa6b8; }
  .button { font-size: 17px; font-weight: 700; fill: #15141b; }
</style>
</svg>