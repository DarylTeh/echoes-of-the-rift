<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1280" height="720" viewBox="0 0 1280 720">
<title>Settings · Account — Echoes of the Rift wireframe</title>
<desc>Editable low-fidelity screen layout. All boxes, labels and controls are separate vector elements.</desc>
<rect width="1280" height="720" fill="#15141b"/>
<text x="32" y="38" class="heading">Settings · Account</text>
<text x="1245" y="36" text-anchor="end" class="tag">EXISTING FLOW</text>
<line x1="32" y1="54" x2="1248" y2="54" stroke="#777386" stroke-width="1"/>
<rect x="220" y="65" width="840" height="590" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="640.0" y="365.0" text-anchor="middle" class="paneltitle">SETTINGS</text><rect x="250" y="125" width="190" height="480" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="345.0" y="370.0" text-anchor="middle" class="paneltitle">CONTROLS · ACCOUNTS · AUDIO · DISPLAY</text><text x="485" y="165" text-anchor="start" class="body">ACCOUNT</text><rect x="485" y="210" width="500" height="130" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="735.0" y="280.0" text-anchor="middle" class="paneltitle">Username · linked status · save status</text><text x="505" y="390" text-anchor="start" class="body">Recovery code · view / replace safely</text><rect x="505" y="435" width="230" height="55" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="620.0" y="467.5" text-anchor="middle" class="button">Manage recovery</text><rect x="755" y="568" width="230" height="52" rx="12" fill="#5cd3d0" fill-opacity=".94" stroke="#5cd3d0" stroke-width="2"/><text x="870.0" y="599.0" text-anchor="middle" class="button">Close</text><text x="505" y="550" text-anchor="start" class="body">Sign out stays here and requires confirmation</text>
<line x1="32" y1="676" x2="1248" y2="676" stroke="#777386" stroke-width="1"/>
<text x="34" y="704" class="small">DESIGN QUESTION</text><text x="190" y="704" class="body">Should account status show linked devices or recovery readiness?</text>
<style>
  text { font-family: Arial, sans-serif; fill: #f2eff8; }
  .heading { font-size: 25px; font-weight: 700; } .tag { font-size: 12px; fill: #5cd3d0; font-weight: 700; letter-spacing: 1px; }
  .paneltitle { font-size: 15px; font-weight: 600; fill: #aaa6b8; letter-spacing: .6px; }
  .body { font-size: 17px; fill: #f2eff8; } .small { font-size: 12px; fill: #aaa6b8; }
  .button { font-size: 17px; font-weight: 700; fill: #15141b; }
</style>
</svg>