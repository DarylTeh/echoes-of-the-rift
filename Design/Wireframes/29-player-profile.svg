<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1280" height="720" viewBox="0 0 1280 720">
<title>Player profile — Echoes of the Rift wireframe</title>
<desc>Editable low-fidelity screen layout. All boxes, labels and controls are separate vector elements.</desc>
<rect width="1280" height="720" fill="#15141b"/>
<text x="32" y="38" class="heading">Player profile</text>
<text x="1245" y="36" text-anchor="end" class="tag">CONCEPT · PAGE NOT IMPLEMENTED</text>
<line x1="32" y1="54" x2="1248" y2="54" stroke="#777386" stroke-width="1"/>
<rect x="110" y="65" width="1060" height="590" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="640.0" y="365.0" text-anchor="middle" class="paneltitle">PROFILE</text><rect x="140" y="110" width="190" height="500" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="235.0" y="365.0" text-anchor="middle" class="paneltitle">MY INFO · ARCHIVE</text><rect x="365" y="115" width="470" height="490" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="600.0" y="365.0" text-anchor="middle" class="paneltitle">AVATAR / FRAME · OWNED / LOCKED</text><rect x="510" y="185" width="180" height="200" rx="12" fill="#302e3a" fill-opacity=".94" stroke="#777386" stroke-width="2"/><path d="M522 173 L678 373 M678 173 L522 373" stroke="#777386" stroke-width="1"/><text x="600.0" y="290.0" text-anchor="middle" class="small">HERO PREVIEW</text><rect x="430" y="503" width="160" height="52" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="510.0" y="534.0" text-anchor="middle" class="button">Avatar</text><rect x="610" y="503" width="160" height="52" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="690.0" y="534.0" text-anchor="middle" class="button">Frame</text><rect x="865" y="115" width="270" height="490" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="1000.0" y="365.0" text-anchor="middle" class="paneltitle">NAME · LEVEL · GUILD · SHOWCASE</text><rect x="890" y="536" width="215" height="54" rx="12" fill="#5cd3d0" fill-opacity=".94" stroke="#5cd3d0" stroke-width="2"/><text x="997.5" y="568.0" text-anchor="middle" class="button">Apply selection</text>
<line x1="32" y1="676" x2="1248" y2="676" stroke="#777386" stroke-width="1"/>
<text x="34" y="704" class="small">DESIGN QUESTION</text><text x="190" y="704" class="body">What should another player learn from your profile?</text>
<style>
  text { font-family: Arial, sans-serif; fill: #f2eff8; }
  .heading { font-size: 25px; font-weight: 700; } .tag { font-size: 12px; fill: #5cd3d0; font-weight: 700; letter-spacing: 1px; }
  .paneltitle { font-size: 15px; font-weight: 600; fill: #aaa6b8; letter-spacing: .6px; }
  .body { font-size: 17px; fill: #f2eff8; } .small { font-size: 12px; fill: #aaa6b8; }
  .button { font-size: 17px; font-weight: 700; fill: #15141b; }
</style>
</svg>