<rect x="100" y="210" width="420" height="340" rx="12" fill="#302e3a" fill-opacity=".94" stroke="#777386" stroke-width="2"/><path d="M112 198 L508 538 M508 198 L112 538" stroke="#777386" stroke-width="1"/><text x="310.0" y="385.0" text-anchor="middle" class="small">HERO / GAME LOGO</text><rect x="610" y="95" width="570" height="530" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="895.0" y="365.0" text-anchor="middle" class="paneltitle">CREATE ACCOUNT</text><text x="675" y="190" text-anchor="start" class="body">Create your account</text><rect x="690" y="237" width="410" height="58" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="895.0" y="271.0" text-anchor="middle" class="paneltitle">Username</text><rect x="690" y="317" width="410" height="58" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="895.0" y="351.0" text-anchor="middle" class="paneltitle">Password · 5+ characters</text><rect x="690" y="397" width="410" height="58" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="895.0" y="431.0" text-anchor="middle" class="paneltitle">Confirm password</text><rect x="690" y="493" width="410" height="62" rx="12" fill="#5cd3d0" fill-opacity=".94" stroke="#5cd3d0" stroke-width="2"/><text x="895.0" y="529.0" text-anchor="middle" class="button">Create account</text><text x="735" y="605" text-anchor="start" class="body">Already have an account? Sign in</text>
