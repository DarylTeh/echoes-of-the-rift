="#777386" stroke-width="1"/><rect x="913.0" y="504.0" width="129.0" height="60.0" rx="7" fill="#15141b" stroke="#777386" stroke-width="1"/><rect x="913.0" y="572.0" width="129.0" height="60.0" rx="7" fill="#15141b" stroke="#777386" stroke-width="1"/><text x="977.5" y="420" text-anchor="middle" class="small">3 SKILLS</text><rect x="1160" y="369" width="66" height="66" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="1193.0" y="407.0" text-anchor="middle" class="button">BAG</text><rect x="1160" y="449" width="66" height="66" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="1193.0" y="487.0" text-anchor="middle" class="button">DODGE</text><rect x="1160" y="529" width="66" height="66" rx="12" fill="#24222e" fill-opacity=".94" stroke="#777386" stroke-width="2"/><text x="1193.0" y="567.0" text-anchor="middle" class="button">STANCE</text>
